    <div class="main-content">
        <div class="section-content section-content-p30">
            <div class="container-fluid">
                <div class="row">

                    <div class="product-detail-container col-md-3" *ngFor="let p of products">
                        <div class="image-container">
                            <img src="{{p.urlImage}}" alt="Imagen producto" />
                        </div>

                        <div class="info-container">
                            <h2>{{ p.name }}</h2>

                            <p><strong>Precio:</strong> ${{ p.price | number:'1.0-0' }}</p>
                            <p><strong>Descripción:</strong>{{ p.description }}</p>
                            <div class="product-show">
                                <a [routerLink]="['/cart/detailproduct', p.id]" routerLinkActive="router-link-active"
                                    class="primary-btn">Ver Producto</a>
                            </div>
                            <button class="add-button" (click)="addToCart(p.id)">Añadir al carrito</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>


</div>

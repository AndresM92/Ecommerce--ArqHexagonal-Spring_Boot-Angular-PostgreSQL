<app-header-container></app-header-container>


<div class="d-flex justify-content-center">
  <div class="form-box">
    <form class="form" (ngSubmit)="login_user()">
      <span class="title">Iniciar Sesion</span>
      <span class="subtitle">Inicia sesion con tu email y contraseña</span>
      <div class="form-container">
        <input id="email" [(ngModel)]="username" type="email" name="email" class="input" placeholder="Email">
        <input id="password" [(ngModel)]="password" type="password" name="password" class="input" placeholder="Password">
      </div>
      <button class="login-button" type="submit">Iniciar Sesion</button>
    </form>
    <div class="form-section">
      <p>Have an account? <a href="">Log in</a> </p>
    </div>
  </div>
</div>
